name: 生成并签名 SBOM

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "package.json"
      - "yarn.lock"
      - "Dockerfile"
  pull_request:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "package.json"
      - "yarn.lock"
      - "Dockerfile"
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    name: 生成 SBOM
    steps:
    - name: 加固运行器（审计所有出站调用）
      uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # v2.15.0
      with:
        egress-policy: audit
    - name: 检出代码
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: 使用 Syft 生成 SBOM
      uses: anchore/sbom-action@17ae1740179002c89186b61233e0f892c3118b11 # v0.23.0
      with:
        format: spdx-json
        output-file: sbom.spdx.json

    - name: 安装 Sigstore
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: 签名 SBOM
      env:
        COSIGN_EXPERIMENTAL: "1"
      run: |
        cosign sign-blob \
          --yes \
          --output-signature sbom.spdx.json.sig \
          --output-certificate sbom.spdx.json.crt \
          --bundle sbom.spdx.json.bundle \
          sbom.spdx.json

    - name: 上传 SBOM 构件
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: sbom
        path: |
          sbom.spdx.json
          sbom.spdx.json.sig
          sbom.spdx.json.crt
        retention-days: 30

    - name: 上传 SBOM 到 GitHub 依赖关系图
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      if: github.event_name != 'pull_request'
      with:
        name: dependency-snapshot
        path: sbom.spdx.json
        retention-days: 30
